schema_version: 1

context:
  name: cite
  version: 0.7.2

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/cite-${{ version }}.tar.gz
  sha256: ff8d68efe23263bacdb4c3ff75507ceb3e5db4820429e740dfe2c501f6076455

build:
  number: 2
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - cite=cite:main

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - setuptools
  run:
    - lxml
    - python >=${{ python_min }}
    - python-slugify
    - requests

tests:
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - pip check
      - cite --help

about:
  license: BSD-2-Clause
  license_file: LICENSE
  summary: Command line tool to get bibliography e.g. BibTex entries
  description: |
    Prints citation from DOIs or URLs of journal articles which
    provide DOIs in their metadata.
  homepage: https://github.com/rgieseke/cite
  repository: https://github.com/rgieseke/cite
  documentation: https://github.com/rgieseke/cite

extra:
  recipe-maintainers:
    - jan-janssen
